<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
  <link rel="stylesheet" href="style.css">
  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  <meta name="description" content="FrontendMentor fylo data storage component challenge."> 
  <title>Frontend Mentor | Fylo data storage component</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <article class="card">
      <!-- There is the top part that includes the filo image and three icons -->
      <nav>
        <img class="company-logo" src="./images/logo.svg" alt="">
        <div class="nav-links">
          <a href="#">
            <img 
              class="nav-icon" 
              src="./images/icon-document.svg" 
              alt="Document link"
              width="20" 
              height="24"
            >
          </a>
          <a href="#"><img class="nav-icon" src="./images/icon-folder.svg" alt="File link"></a>
          <a href="#"><img class="nav-icon" src="./images/icon-upload.svg" alt="upload link"></a>
        </div>
      </nav>
      <section class="storage-info-container">
        <div class="text-info-container">
          <p class="text-line text-preset-2">You’ve used <span class="text-preset-2-bold">815 GB</span> of your storage</p>
          <div class="progress-bar-container">
            <div class="progress-bar">
              <div class="progress-bar-knob"></div>
            </div>
          </div>
          <div class="progress-bar-range">
            <span class="progress-bar__begin text-preset-3-bold">0 GB</span>
            <span class="progress-bar__end text-preset-3-bold">1000 GB</span>
          </div>
          <p class="storage-left text-preset-3-bold"><span class="text-preset-1 storage-left-number">185</span> GB Left</p>
        </div>
      </section>
    </article>
  </main>
  <footer class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>. 
    Coded by <a href="#">Your Name Here</a>.
  </footer>
</body>
</html>
